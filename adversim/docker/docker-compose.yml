version: '3.8'

networks:
  adversim-net:
    name: adversim-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # --- 5 User Nodes ---
  node-user-1:
    build:
      context: ./node
    container_name: node-user-1
    hostname: node-user-1
    networks:
      adversim-net:
        ipv4_address: 172.20.0.11
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=User
      - NODE_NAME=User Workstation 01

  node-user-2:
    build:
      context: ./node
    container_name: node-user-2
    hostname: node-user-2
    networks:
      adversim-net:
        ipv4_address: 172.20.0.12
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=User
      - NODE_NAME=User Workstation 02

  node-user-3:
    build:
      context: ./node
    container_name: node-user-3
    hostname: node-user-3
    networks:
      adversim-net:
        ipv4_address: 172.20.0.13
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=User
      - NODE_NAME=User Workstation 03

  node-user-4:
    build:
      context: ./node
    container_name: node-user-4
    hostname: node-user-4
    networks:
      adversim-net:
        ipv4_address: 172.20.0.14
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=User
      - NODE_NAME=User Workstation 04

  node-user-5:
    build:
      context: ./node
    container_name: node-user-5
    hostname: node-user-5
    networks:
      adversim-net:
        ipv4_address: 172.20.0.15
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=User
      - NODE_NAME=User Workstation 05

  # --- 3 Server Nodes ---
  node-server-1:
    build:
      context: ./node
    container_name: node-server-1
    hostname: node-server-1
    networks:
      adversim-net:
        ipv4_address: 172.20.0.21
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=Server
      - NODE_NAME=Application Server 01

  node-server-2:
    build:
      context: ./node
    container_name: node-server-2
    hostname: node-server-2
    networks:
      adversim-net:
        ipv4_address: 172.20.0.22
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=Server
      - NODE_NAME=Database Cluster Server 02

  node-server-3:
    build:
      context: ./node
    container_name: node-server-3
    hostname: node-server-3
    networks:
      adversim-net:
        ipv4_address: 172.20.0.23
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=Server
      - NODE_NAME=Internal Web Gateway 03

  # --- 2 Admin Nodes ---
  node-admin-1:
    build:
      context: ./node
    container_name: node-admin-1
    hostname: node-admin-1
    networks:
      adversim-net:
        ipv4_address: 172.20.0.31
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=Admin
      - NODE_NAME=Domain Controller Admin 01

  node-admin-2:
    build:
      context: ./node
    container_name: node-admin-2
    hostname: node-admin-2
    networks:
      adversim-net:
        ipv4_address: 172.20.0.32
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=Admin
      - NODE_NAME=Security Management Admin 02

  # --- 2 Honeypot Nodes ---
  honeypot-1:
    build:
      context: ./honeypot
    container_name: honeypot-1
    hostname: honeypot-1
    networks:
      adversim-net:
        ipv4_address: 172.20.0.91
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=Honeypot
      - FIDELITY=Medium
      - NODE_NAME=Decoy Database Honeypot 01

  honeypot-2:
    build:
      context: ./honeypot
    container_name: honeypot-2
    hostname: honeypot-2
    networks:
      adversim-net:
        ipv4_address: 172.20.0.92
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    environment:
      - NODE_TYPE=Honeypot
      - FIDELITY=High
      - NODE_NAME=Decoy Admin Jumpbox Honeypot 02
